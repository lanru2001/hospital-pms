name: Terraform Infra

on:
  push:
    branches: [main]
    paths:
      - "iac/**"
      - ".github/workflows/iac.yml"
  pull_request:
    branches: [main]
    paths:
      - "iac/**"
      - ".github/workflows/iac.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, qa, prod]
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write     # required for OIDC -> AWS
  contents: read
  pull-requests: write # required to comment the plan on PRs

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.5"
  TF_WORKING_DIR: iac

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

  fmt-and-validate:
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Debug GitHub OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("OIDC claims:");
            console.log(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              repository_id: payload.repository_id,
              repository_owner: payload.repository_owner,
              repository_owner_id: payload.repository_owner_id,
              ref: payload.ref,
              workflow: payload.workflow,
              job_workflow_ref: payload.job_workflow_ref
            }, null, 2));

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::418300104773:role/hospital-pms-github-deploy-role
          role-session-name: GitHubActionsECSDeployment

      - name: Terraform fmt check
        run: terraform fmt -recursive

      - name: Terraform init
        run: terraform init -backend-config=backend_config/${{ needs.resolve-env.outputs.environment }}.conf

      - name: Terraform validate
        run: terraform validate

      - name: tfsec scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ env.TF_WORKING_DIR }}
          severity: CRITICAL,HIGH
          exit-code: "0" # soft fail — review findings without blocking, tighten later

  plan:
    runs-on: ubuntu-latest
    needs: [resolve-env, fmt-and-validate]
    environment: ${{ needs.resolve-env.outputs.environment }}
    if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::418300104773:role/hospital-pms-github-deploy-role
          role-session-name: GitHubActionsECSDeployment

      - name: Terraform init
        run: terraform init -backend-config=backend_config/${{ needs.resolve-env.outputs.environment }}.conf

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -no-color \
            -var-file=env/${{ needs.resolve-env.outputs.environment }}/${{ needs.resolve-env.outputs.environment }}.tfvars \
            -out=tfplan | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8').slice(-60000);
            const env = '${{ needs.resolve-env.outputs.environment }}';
            const body = `#### Terraform Plan (${env})\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.resolve-env.outputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

  apply:
    runs-on: ubuntu-latest
    needs: [resolve-env, fmt-and-validate]
    environment: ${{ needs.resolve-env.outputs.environment }}
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event.inputs.action == 'apply'
    # A GitHub Environment named "prod" (or whatever resolve-env outputs)
    # with required reviewers will now gate this job automatically, since
    # `environment:` above is set dynamically.
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::418300104773:role/hospital-pms-github-deploy-role
          role-session-name: GitHubActionsECSDeployment

      - name: Terraform init
        run: terraform init -backend-config=backend_config/${{ needs.resolve-env.outputs.environment }}.conf

      - name: Terraform apply
        run: |
          terraform apply -auto-approve \
            -var-file=env/${{ needs.resolve-env.outputs.environment }}/${{ needs.resolve-env.outputs.environment }}.tfvars

      - name: Output infra values
        run: terraform output -json > tf_outputs.json

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: tf_outputs-${{ needs.resolve-env.outputs.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tf_outputs.json
          retention-days: 30

  destroy:
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.environment }}
    if: github.event.inputs.action == 'destroy'
    # A GitHub Environment with required reviewers is strongly recommended
    # here given this is a destructive action.
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::418300104773:role/hospital-pms-github-deploy-role
          role-session-name: GitHubActionsECSDeployment

      - name: Terraform init
        run: terraform init -backend-config=backend_config/${{ needs.resolve-env.outputs.environment }}.conf

      - name: Terraform destroy
        run: |
          terraform destroy -input=false -auto-approve \
            -var-file=env/${{ needs.resolve-env.outputs.environment }}/${{ needs.resolve-env.outputs.environment }}.tfvars \
            -var="github_repo=${{ github.repository }}" \
            -var="domain_name=${{ vars.DOMAIN_NAME }}"
